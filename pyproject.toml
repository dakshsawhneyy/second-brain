[project]
name = "secondbrain"
version = "0.1.0"
description = "Personal second brain: memory cards, local search, Telegram bot"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "youtube-transcript-api>=1.0",
    "fastembed>=0.4",
    "numpy>=1.26",
    "python-telegram-bot>=21",
    "cryptography>=42",
    "faster-whisper>=1.0",
    "av>=14,<16",  # newer av breaks faster-whisper (metadata_errors)
    "pypdf>=6.0",  # text out of shared PDF files (older versions have known hang/decompression-bomb bugs)
]

[project.scripts]
sb = "secondbrain.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: loads real models or hits the network (deselect with -m 'not slow')"]
addopts = "-m 'not slow'"
